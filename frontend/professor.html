<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Professor</title></head>
<body class="container py-4">
<h2>Start session <button class="btn btn-sm btn-link" onclick="localStorage.clear();location.href='login.html'">logout</button></h2>
<div class="row g-2 mb-3">
<div class="col"><input id="sub" class="form-control" value="FSJP-A"></div>
<div class="col"><input id="dur" type="number" class="form-control" value="10"></div>
<div class="col"><input id="rad" type="number" class="form-control" value="100"></div></div>
<div class="row g-2 mb-3">
<div class="col"><input id="lat" class="form-control" placeholder="lat e.g. 19.0760"></div>
<div class="col"><input id="lng" class="form-control" placeholder="lng e.g. 72.8777"></div>
<div class="col"><button class="btn btn-outline-secondary" onclick="navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lng.value=p.coords.longitude})">Use my location</button></div></div>
<button class="btn btn-primary" onclick="start()">Start + QR</button>
<div id="out" class="mt-3"></div>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("PROFESSOR"); let sid=null,timer=null;
async function start(){
 const j=await api("/api/sessions",{method:"POST",body:JSON.stringify({subject:sub.value,durationMinutes:+dur.value,lat:+lat.value||19.076,lng:+lng.value||72.8777,radius:+rad.value})});
 sid=j.id;
 document.getElementById("out").innerHTML=`<p>Token: <code>${j.token}</code> | ends: ${j.endsAt}</p>
 <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(j.qrUrl)}">
 <p><a href="${j.qrUrl}">${j.qrUrl}</a></p><p id="cd"></p>
 <button class="btn btn-success btn-sm" onclick="load()">Refresh list</button>
 <a class="btn btn-outline-success btn-sm" href="${API_BASE}/api/sessions/${sid}/records?format=csv">CSV</a><div id="list"></div>`;
 const end=new Date(j.endsAt).getTime();
 clearInterval(timer); timer=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));document.getElementById("cd").textContent="closes in "+s+"s";if(s<=0)clearInterval(timer)},1000);
 load();
}
async function load(){ if(!sid)return;
 // CSV needs auth header; use fetch for table, direct link works only if backend allows — so table here:
 const j=await api(`/api/sessions/${sid}/records`);
 document.getElementById("list").innerHTML="<ul class='list-group mt-2'>"+j.map(r=>`<li class='list-group-item'>${r.student} (${r.identifier}) — ${r.distanceMeters}m</li>`).join("")+"</ul>";
}
setInterval(()=>{if(sid)load().catch(()=>{})},5000);
</script></body></html>
