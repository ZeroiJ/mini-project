<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Login</title></head>
<body class="container py-5" style="max-width:420px">
<h2>Login</h2>
<input id="i" class="form-control mb-2" placeholder="prof@demo / s1@demo">
<input id="p" type="password" class="form-control mb-2" placeholder="password">
<button class="btn btn-primary w-100" onclick="go()">Login</button>
<p id="e" class="text-danger mt-2"></p>
<script src="config.js"></script><script src="app.js"></script>
<script>async function go(){
 try{ const j=await api("/api/auth/login",{method:"POST",body:JSON.stringify({identifier:i.value,password:p.value})});
 localStorage.setItem("token",j.token);localStorage.setItem("role",j.role);localStorage.setItem("name",j.name);
 location.href=j.role==="PROFESSOR"?"professor.html":"student.html";
 }catch(e){ document.getElementById("e").textContent=e.message; }
}</script></body></html>
