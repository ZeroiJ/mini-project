<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student — Attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<header class="masthead"><div class="wrap"><h1>Attend — Student</h1><a href="login.html" onclick="localStorage.clear()">Logout</a></div></header>
<main class="page">
<div class="box">
<h2>Mark attendance</h2>
<p id="s" role="status">Loading session…</p>
<button class="btn btn-block" id="go" onclick="mark()">Submit with my GPS</button>
<p id="m" class="status" role="status" hidden></p>
<p id="e" class="error" role="alert"></p>
</div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("STUDENT");
const tok=new URLSearchParams(location.search).get("s");
let radius=null;
const fmt=d=>d>=1000?(d/1000).toFixed(1)+" km":Math.round(d)+" m";
async function init(){ if(!tok){s.textContent="No session code. Scan the professor's QR first.";go.disabled=true;return;}
 try{const j=await api("/api/sessions/"+tok);
 radius=j.radiusMeters||null;
 s.innerHTML=`<span class="token">${j.subject}</span> — ends <span class="num">${j.endsAt}</span>${radius?` · radius <span class="num">${radius} m</span>`:""}${j.expired?" (EXPIRED)":""}`;
 if(j.expired) go.disabled=true;}
 catch(e){s.textContent=e.message+". Ask the professor for a fresh QR.";go.disabled=true;}}
async function mark(){
 const m=document.getElementById("m"),e=document.getElementById("e");
 e.textContent="";m.hidden=false;go.disabled=true;m.textContent="Locating… allow location if prompted";
 let p;
 try{ p=await getPosition(); }
 catch(err){
  go.disabled=false;
  if(err&&err.code===1){ m.hidden=true; e.textContent="GPS denied. Allow location for this site, then try again."; }
  else { m.textContent="No GPS fix. Turn location on and try again."; }
  return;
 }
 m.textContent="Submitting…";
 try{
  const j=await api("/api/attendance",{method:"POST",body:JSON.stringify({sessionToken:tok,lat:p.coords.latitude,lng:p.coords.longitude})});
  m.textContent=`Present. ${fmt(j.distanceMeters)} from classroom.`;
 }catch(e2){
  const d=e2.data&&typeof e2.data.distanceMeters==="number"?e2.data.distanceMeters:null;
  const allowed=e2.data&&e2.data.radiusMeters!=null?e2.data.radiusMeters:radius;
  if(d!==null){
   const acc=p.coords.accuracy>=100?` Your GPS is only accurate to ±${Math.round(p.coords.accuracy)} m.`:"";
   m.textContent=`Not marked: you are ${fmt(d)} from the classroom`+(allowed!=null?` (allowed ${allowed} m)`:``)+`.${acc} Move closer and try again.`;
  } else {
   m.textContent="Not marked: "+e2.message+".";
  }
 }finally{ go.disabled=false; }
}
init();</script></body></html>
