<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Professor — Attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<header class="masthead"><div class="wrap"><h1>Attend — Professor</h1><a href="login.html" onclick="localStorage.clear()">Logout</a></div></header>
<main class="page">
<div class="box">
<h2>Start session</h2>
<div class="row">
<div><label for="sub">Subject</label><input id="sub" type="text" value="FSJP-A"></div>
<div><label for="dur">Minutes</label><input id="dur" type="number" value="10" min="1" max="180"></div>
<div><label for="rad">Radius (m)</label><input id="rad" type="number" value="100" min="10"></div>
</div>
<div class="row">
<div><label for="lat">Classroom latitude</label><input id="lat" type="text" placeholder="19.0760"></div>
<div><label for="lng">Classroom longitude</label><input id="lng" type="text" placeholder="72.8777"></div>
</div>
<div class="btn-row">
<button class="btn" onclick="start()">Start + show QR</button>
<button class="btn btn-quiet" onclick="navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lng.value=p.coords.longitude})">Use my location</button>
</div>
<p id="e" class="error" role="alert"></p>
</div>
<div class="box" id="outbox" hidden>
<h2>Session</h2>
<div id="out"></div>
</div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("PROFESSOR"); let sid=null,timer=null;
async function start(){
 document.getElementById("e").textContent="";
 try{
 const j=await api("/api/sessions",{method:"POST",body:JSON.stringify({subject:sub.value,durationMinutes:+dur.value,lat:+lat.value||19.076,lng:+lng.value||72.8777,radius:+rad.value})});
 sid=j.id;
 document.getElementById("outbox").hidden=false;
 document.getElementById("out").innerHTML=`<p>Token: <span class="token">${j.token}</span> | ends <span class="num">${j.endsAt}</span></p>
 <div class="qr"><img width="220" height="220" alt="QR code for student check-in" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(j.qrUrl)}"></div>
 <p><a href="${j.qrUrl}">${j.qrUrl}</a></p><p class="countdown" id="cd" role="status"></p>
 <div class="btn-row"><button class="btn btn-quiet" onclick="load()">Refresh list</button>
 <a class="btn btn-quiet" href="${API_BASE}/api/sessions/${sid}/records?format=csv">CSV</a></div><ul class="records" id="list"></ul>`;
 const end=new Date(j.endsAt).getTime();
 clearInterval(timer); timer=setInterval(()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));document.getElementById("cd").textContent=s>0?("closes in "+s+"s"):"closed";if(s<=0)clearInterval(timer)},1000);
 load();
 }catch(e){ document.getElementById("e").textContent=e.message+". Fix the fields and try again."; }
}
async function load(){ if(!sid)return;
 const j=await api(`/api/sessions/${sid}/records`);
 document.getElementById("list").innerHTML=j.length?j.map(r=>`<li>${r.student} (${r.identifier}) — <span class="num">${r.distanceMeters}m</span></li>`).join(""):"<li>No check-ins yet.</li>";
}
setInterval(()=>{if(sid)load().catch(()=>{})},5000);
</script></body></html>
