<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Student</title></head>
<body class="container py-4" style="max-width:520px">
<h2>Mark attendance</h2>
<p id="s">loading session…</p>
<button class="btn btn-success w-100" onclick="mark()">Submit with my GPS</button>
<p id="m" class="mt-2"></p>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("STUDENT");
const tok=new URLSearchParams(location.search).get("s");
async function init(){ if(!tok){s.textContent="Scan a QR first (no ?s=TOKEN).";return;}
 try{const j=await api("/api/sessions/"+tok);s.textContent=`${j.subject} — ends ${j.endsAt}${j.expired?" (EXPIRED)":""}`;}
 catch(e){s.textContent=e.message;}}
function mark(){m.textContent="locating…";
 navigator.geolocation.getCurrentPosition(async p=>{
  try{const j=await api("/api/attendance",{method:"POST",body:JSON.stringify({sessionToken:tok,lat:p.coords.latitude,lng:p.coords.longitude})});
  m.textContent=`Present! ${Math.round(j.distanceMeters)}m away.`;}
  catch(e){m.textContent=e.message;}},()=>m.textContent="GPS denied — allow location.",{enableHighAccuracy:true});}
init();</script></body></html>
