spring.application.name=attend
# H2 default (zero setup). MySQL via env: DB_URL, DB_USER, DB_PASS, FRONTEND_URL
spring.datasource.url=${DB_URL:jdbc:h2:mem:attend;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=always
app.frontend-url=${FRONTEND_URL:http://localhost:8000}
server.port=8080
