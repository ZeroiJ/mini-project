<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Report</title></head>
<body class="container py-4"><h2>Report</h2>
<input id="sid" class="form-control mb-2" placeholder="session id">
<button class="btn btn-primary" onclick="go()">Load</button><div id="o" class="mt-3"></div>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("PROFESSOR");
async function go(){const j=await api(`/api/sessions/${sid.value}/records`);
o.innerHTML="<table class='table'><tr><th>Student</th><th>Dist</th><th>At</th></tr>"+j.map(r=>`<tr><td>${r.student}</td><td>${r.distanceMeters}m</td><td>${r.submittedAt}</td></tr>`).join("")+"</table>";}</script></body></html>
