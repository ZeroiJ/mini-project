<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<header class="masthead"><div class="wrap"><h1>Attend</h1><a href="index.html">Home</a></div></header>
<main class="page">
<div class="box">
<h2>Login</h2>
<label for="i">ID</label>
<input id="i" type="text" autocomplete="username" placeholder="prof@demo / s1@demo">
<label for="p">Password</label>
<input id="p" type="password" autocomplete="current-password" placeholder="password">
<button class="btn btn-block" onclick="go()">Login</button>
<p id="e" class="error" role="alert"></p>
</div>
<div class="box">
<h2>Demo accounts</h2>
<p class="muted">Professor: <code>prof@demo / prof123</code><br>Students: <code>s1@demo / s123</code>, <code>s2@demo</code>, <code>s3@demo</code></p>
</div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>async function go(){
 const btn=document.querySelector(".btn"); btn.disabled=true; btn.textContent="Logging in…";
 try{ const j=await api("/api/auth/login",{method:"POST",body:JSON.stringify({identifier:i.value,password:p.value})});
 localStorage.setItem("token",j.token);localStorage.setItem("role",j.role);localStorage.setItem("name",j.name);
 location.href=j.role==="PROFESSOR"?"professor.html":"student.html";
 }catch(e){ document.getElementById("e").textContent=e.message+". Check the ID/password and try again."; btn.disabled=false; btn.textContent="Login"; }
}</script></body></html>
