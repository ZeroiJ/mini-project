<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student — Attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<header class="masthead"><div class="wrap"><h1>Attend — Student</h1><a href="login.html" onclick="localStorage.clear()">Logout</a></div></header>
<main class="page">
<div class="box">
<h2>Mark attendance</h2>
<p id="s" role="status">Loading session…</p>
<button class="btn btn-block" id="go" onclick="mark()">Submit with my GPS</button>
<p id="m" class="status" role="status" hidden></p>
<p id="e" class="error" role="alert"></p>
</div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("STUDENT");
const tok=new URLSearchParams(location.search).get("s");
async function init(){ if(!tok){s.textContent="No session code. Scan the professor's QR first.";go.disabled=true;return;}
 try{const j=await api("/api/sessions/"+tok);s.innerHTML=`<span class="token">${j.subject}</span> — ends <span class="num">${j.endsAt}</span>${j.expired?" (EXPIRED)":""}`;
 if(j.expired) go.disabled=true;}
 catch(e){s.textContent=e.message+". Ask the professor for a fresh QR.";go.disabled=true;}}
function mark(){const m=document.getElementById("m");m.hidden=false;m.textContent="Locating…";
 document.getElementById("e").textContent="";
 navigator.geolocation.getCurrentPosition(async p=>{
  try{const j=await api("/api/attendance",{method:"POST",body:JSON.stringify({sessionToken:tok,lat:p.coords.latitude,lng:p.coords.longitude})});
  m.textContent=`Present. ${Math.round(j.distanceMeters)}m from classroom.`;}
  catch(e){m.textContent="Not marked: "+e.message+". Move inside the classroom radius and try again.";}},()=>{m.hidden=true;document.getElementById("e").textContent="GPS denied. Allow location for this site and try again.";},{enableHighAccuracy:true});}
init();</script></body></html>
