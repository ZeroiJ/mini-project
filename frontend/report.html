<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report — Attend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Fira+Sans:wght@400;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet"></head>
<body>
<header class="masthead"><div class="wrap"><h1>Attend — Report</h1><a href="professor.html">Back</a></div></header>
<main class="page">
<div class="box">
<h2>Report</h2>
<label for="sid">Session ID</label>
<input id="sid" type="text" placeholder="e.g. 1">
<button class="btn btn-block" onclick="go()">Load</button>
<p id="e" class="error" role="alert"></p>
<div id="o"></div>
</div>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>needLogin("PROFESSOR");
async function go(){document.getElementById("e").textContent="";
 try{const j=await api(`/api/sessions/${sid.value}/records`);
 o.innerHTML=j.length?"<table class='records'><tr><th>Student</th><th>Dist</th><th>At</th></tr>"+j.map(r=>`<tr><td>${r.student}</td><td class="num">${r.distanceMeters}m</td><td class="num">${r.submittedAt}</td></tr>`).join("")+"</table>":"<p class='muted'>No check-ins for this session.</p>";
 }catch(e){ document.getElementById("e").textContent=e.message+". Check the session ID."; }}</script></body></html>
