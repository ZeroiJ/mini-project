spring.application.name=attend
# H2 default (zero setup). Postgres via env: DB_URL, DB_USER, DB_PASS, FRONTEND_URL
# No driver-class-name: Spring picks the driver from the JDBC URL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:attend;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=always
app.frontend-url=${FRONTEND_URL:http://localhost:8000}
server.port=8080
